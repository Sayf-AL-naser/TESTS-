<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seventh Man – Interactive Lesson</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1030;--night2:#141b4d;--gold:#ffd23f;--teal:#2ec4b6;--red:#ff4d6d;--green:#3ddc84;--purple:#7b5cff;--orange:#ff9f1c;--ink:#1b1f3b;--soft:#f3f4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#3a4bb8 0%,var(--night2) 40%,var(--night) 75%)}
.beam{position:fixed;top:-10vh;width:30vw;height:120vh;pointer-events:none;opacity:.14;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,220,.9),rgba(255,255,220,0));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0}
.beam.l{left:2vw;animation:swL 7s ease-in-out infinite}.beam.r{right:2vw;animation:swR 8s ease-in-out infinite}
@keyframes swL{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(14deg)}}
@keyframes swR{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-14deg)}}
.party .beam{opacity:.35}

header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap}
.logo{font-family:'Bungee';font-size:clamp(17px,2.2vw,26px);text-shadow:0 3px 0 #000,0 0 18px rgba(46,196,182,.7)}
.logo small{display:block;font-family:'Nunito';font-size:12px;font-weight:900;color:var(--teal);letter-spacing:2px;text-shadow:none}
.stars{display:flex;gap:5px;align-items:center}
.stars button{background:none;border:0;padding:0;cursor:pointer;position:relative}
.star{width:34px;height:34px;filter:drop-shadow(0 2px 0 #000);display:block}
.star path{fill:#2a3170;stroke:#525ba8;stroke-width:1.5;transition:fill .3s}
.on .star path{fill:var(--gold);stroke:#fff3b0}
.on .star{animation:pop .6s ease}
.cur .star path{stroke:var(--teal);stroke-width:2.6}
.stars button span{position:absolute;inset:0;display:grid;place-items:center;font:900 11px 'Nunito';color:#9aa3e6;pointer-events:none;padding-top:2px}
.on span{color:#6b4e00}
@keyframes pop{0%{transform:scale(.3) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ic{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:7px 11px;font:800 13px 'Nunito';cursor:pointer}
.ic:hover{background:rgba(255,255,255,.2)}
.ic.off{opacity:.5}

main{position:relative;z-index:4;max-width:1180px;margin:0 auto;padding:4px 18px 200px}
.slide{background:#fff;color:var(--ink);border-radius:24px;padding:28px 32px 24px;border:4px solid #fff;position:relative;
  box-shadow:0 10px 0 #000,0 0 40px rgba(46,196,182,.35);animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1}}
.pt{position:absolute;top:-18px;left:24px;background:var(--red);color:#fff;font-family:'Bungee';padding:6px 14px;border-radius:12px;box-shadow:0 4px 0 #000;font-size:15px}
.tag{position:absolute;top:-16px;right:24px;background:var(--teal);color:#05232a;font-weight:900;padding:5px 12px;border-radius:12px;box-shadow:0 4px 0 #000;font-size:13px;letter-spacing:1px;text-transform:uppercase}
h1{font-family:'Bungee';font-weight:400;font-size:clamp(26px,3.6vw,44px);margin:8px 0 6px;line-height:1.05}
h1 span{color:#2b7fff}
.lead{font-size:clamp(17px,1.9vw,22px);font-weight:800;color:#4a4f7a;margin:0 0 18px;line-height:1.35}
p,li{font-size:clamp(16px,1.7vw,20px);line-height:1.45;font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.box{background:var(--soft);border-radius:18px;padding:16px 18px;border:3px solid #e2e5fb}
.box h3{margin:0 0 6px;font-size:20px;font-weight:900}
.c1{border-color:#ffb3c1;background:#fff2f5}.c2{border-color:#9ee9e1;background:#eefcfa}.c3{border-color:#ffd59a;background:#fff7ea}.c4{border-color:#c6b8ff;background:#f4f0ff}
.reveal{cursor:pointer;position:relative;min-height:120px;transition:transform .15s}
.reveal:hover{transform:translateY(-3px)}
.reveal .hid{display:none;margin-top:8px;font-weight:700}
.reveal.open .hid{display:block;animation:in .3s}
.reveal .tap{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:900;color:#8a8fbf;letter-spacing:1px}
.reveal.open .tap{display:none}
/* flip cards */
.flip{perspective:900px;cursor:pointer;height:150px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;backface-visibility:hidden;border:3px solid}
.flip .f{font-family:'Bungee';font-size:clamp(18px,2vw,26px);color:#fff}
.flip .b{transform:rotateY(180deg);background:#fff;font-size:clamp(14px,1.45vw,17px);font-weight:800;color:var(--ink)}
.flip .b i{display:block;font-style:normal;color:#6b6fa0;font-size:.9em;margin-top:6px}
.k1 .f{background:#ff4d6d;border-color:#c9304d}.k2 .f{background:#2ec4b6;border-color:#1a8f84}.k3 .f{background:#ff9f1c;border-color:#c57400}
.k4 .f{background:#7b5cff;border-color:#5636d6}.k5 .f{background:#2b7fff;border-color:#1557c4}.k6 .f{background:#3ddc84;border-color:#1fae5e}
.k1 .b{border-color:#ff4d6d}.k2 .b{border-color:#2ec4b6}.k3 .b{border-color:#ff9f1c}.k4 .b{border-color:#7b5cff}.k5 .b{border-color:#2b7fff}.k6 .b{border-color:#3ddc84}
/* timeline */
.tl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.step{flex:1 1 160px;background:var(--soft);border:3px dashed #c9cdf0;border-radius:16px;padding:12px;cursor:pointer;min-height:96px;font-weight:800;position:relative}
.step>b{font-family:'Bungee';font-weight:400;color:#7b5cff;font-size:15px;display:block;margin-bottom:4px}
.step .hid{display:none}
.step.open{border-style:solid;border-color:#7b5cff;background:#f4f0ff}
.step.open .hid{display:block;animation:in .3s}
.step .q{color:#9aa0cf}
.step.open .q{display:none}
/* vote */
.vote{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:1fr 58px 58px 64px;gap:8px;align-items:center}
.vrow .lab{background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(15px,1.6vw,19px);position:relative;overflow:hidden}
.vrow .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c9f6ef,#fff1b8);width:0;transition:width .4s;z-index:0}
.vrow .lab span{position:relative;z-index:1}
.vrow button{height:44px;border-radius:12px;border:0;font:900 20px 'Nunito';cursor:pointer;color:#fff}
.vrow .plus{background:var(--green);box-shadow:0 4px 0 #1fae5e}.vrow .minus{background:#b7bce0;box-shadow:0 4px 0 #8c91bd}
.vrow .n{font-family:'Bungee';font-size:24px;text-align:center}
/* frame diagram */
.frame{border:5px solid #2b7fff;border-radius:22px;padding:16px;background:#eef5ff;cursor:pointer;position:relative}
.frame .inner{border:5px solid var(--red);border-radius:18px;padding:16px;background:#fff2f5;margin-top:10px;cursor:pointer}
.frame .lbl{font-family:'Bungee';font-size:16px}
.frame .hid{display:none;font-weight:800;margin-top:6px}
.frame.open>.hid,.inner.open>.hid{display:block;animation:in .3s}
/* eye of storm */
.storm{position:relative;width:190px;height:190px;margin:0 auto}
.storm .ring{position:absolute;inset:0;border-radius:50%;border:14px dashed rgba(43,127,255,.55);animation:spin 6s linear infinite}
.storm .ring2{inset:26px;border-width:10px;border-color:rgba(46,196,182,.6);animation-duration:4s;animation-direction:reverse}
.storm .eye{position:absolute;inset:70px;border-radius:50%;background:#fff7d6;border:3px solid var(--gold);display:grid;place-items:center;font:900 12px 'Nunito';color:#8a6400;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
/* bottom bar */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}
.big{font-family:'Bungee';font-size:18px;border:none;border-radius:16px;padding:12px 22px;cursor:pointer;color:#1b1f3b;background:var(--gold);box-shadow:0 6px 0 #b8860b}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.big.ghost{background:#e9ebff;box-shadow:0 6px 0 #b7bce0}
.big.award{background:var(--green);box-shadow:0 6px 0 #1fae5e;color:#053}
.big:disabled{opacity:.35;cursor:default}
.timer{display:flex;align-items:center;gap:6px;background:#1b1f3b;color:#fff;border-radius:16px;padding:6px 8px}
.timer button{background:#2e3470;border:0;color:#fff;border-radius:10px;padding:7px 9px;font:900 13px 'Nunito';cursor:pointer}
.timer .t{font-family:'Bungee';font-size:22px;min-width:76px;text-align:center}
.timer.end .t{color:var(--red);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.2}}
.task{background:#1b1f3b;color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(15px,1.6vw,19px);margin-top:14px}
.task b{color:var(--gold);font-family:'Bungee';font-weight:400}
.chip{display:inline-block;background:#e9ebff;border-radius:10px;padding:3px 9px;margin:2px;font-weight:900}
.answer{display:none;color:#1a8f4a}
.show .answer{display:inline}
.check{cursor:pointer}
.author{display:flex;gap:16px;align-items:center}
.avatar{flex:0 0 90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#2b7fff,#7b5cff);display:grid;place-items:center;font-size:44px}

/* crowd */
.crowd{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(11,16,48,0) 0%,#070a22 55%);transition:transform .4s}
.crowd.hide{transform:translateY(100%)}
.rowc{position:absolute;left:-2%;right:-2%;display:flex;justify-content:space-around}
.r1{bottom:100px;transform:scale(.7);filter:brightness(.55)}.r2{bottom:50px;transform:scale(.84);filter:brightness(.75)}.r3{bottom:-8px}
.fan{position:relative;width:56px;height:106px;animation:sway 2.4s ease-in-out infinite}
.fan .head{position:absolute;left:13px;top:6px;width:30px;height:30px;border-radius:50%}
.fan .hair{position:absolute;left:11px;top:2px;width:34px;height:16px;border-radius:18px 18px 4px 4px}
.fan .body{position:absolute;left:7px;top:36px;width:42px;height:72px;border-radius:16px 16px 0 0}
.fan .arm{position:absolute;top:42px;width:11px;height:40px;border-radius:6px;transform-origin:50% 4px;transition:transform .25s}
.fan .arm.l{left:1px;transform:rotate(18deg)}.fan .arm.r{right:1px;transform:rotate(-18deg)}
.fan .eye{position:absolute;top:17px;width:4px;height:4px;background:#111;border-radius:50%}.fan .eye.a{left:22px}.fan .eye.b{left:32px}
.fan .mouth{position:absolute;left:24px;top:26px;width:9px;height:3px;border-radius:0 0 6px 6px;background:#3a1a1a}
.fan .sign{position:absolute;left:-9px;top:-34px;width:74px;height:30px;border-radius:6px;background:#fff;color:#111;font:900 11px/30px 'Nunito';text-align:center;box-shadow:0 2px 0 #000;display:none}
.fan.hasSign .sign{display:block}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
.crowd.cheer .fan{animation:jump .45s ease-in-out infinite}
.crowd.cheer .fan .arm.l{transform:rotate(160deg)}.crowd.cheer .fan .arm.r{transform:rotate(-160deg)}
.crowd.cheer .fan .mouth{height:9px;width:11px;left:23px;border-radius:0 0 8px 8px}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.crowd.wave .fan{animation:mex 1.6s ease-in-out}
@keyframes mex{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px)}}
.crowd.ooh .fan .mouth{width:8px;height:8px;border-radius:50%;left:24px}
.crowd.ooh .fan{animation:lean .9s ease-in-out}
@keyframes lean{50%{transform:translateY(-8px) scale(1.04)}}
canvas#fx{position:fixed;inset:0;z-index:6;pointer-events:none}
.host{display:flex;align-items:center;gap:12px;margin:0 0 20px;min-height:50px}
.mic{flex:0 0 44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 4px 0 #000;font-size:22px}
.bubble{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:9px 14px;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div class="beam l"></div><div class="beam r"></div>
<header>
  <div class="logo">THE SEVENTH MAN<small>UNIT 2 · SURVIVAL · INTERACTIVE LESSON</small></div>
  <div class="stars" id="stars"></div>
  <div class="ctrl">
    <button class="ic" id="mBtn">🎵 Music</button>
    <button class="ic off" id="seaBtn">🌊 Sea</button>
    <button class="ic" id="sfxBtn">📣 Crowd</button>
    <button class="ic" id="fanBtn">👥 Fans</button>
    <button class="ic" id="fsBtn">⛶ Full screen</button>
  </div>
</header>
<main>
  <div class="host"><div class="mic">🎤</div><div class="bubble" id="host">Welcome, readers! Press START to begin the lesson.</div></div>
  <div id="app"></div>
</main>
<div class="crowd" id="crowd"><div class="rowc r1" id="row1"></div><div class="rowc r2" id="row2"></div><div class="rowc r3" id="row3"></div></div>
<canvas id="fx"></canvas>

<script>
/* =================== LESSON CONTENT (myPerspectives Gr.9 Unit 2, SB pp.132–151) ===================
   Story content is summarised in our own words. Students read the full text in their books. */
const P = [
{tag:"Warm-up", title:'What does it take to <span>survive</span>?', time:180, host:"Point 1! Let’s warm up those brains!",
 html:`<p class="lead">Unit 2 asks one big question. Before we read, think about what survival really needs.</p>
 <div class="grid g3">
  <div class="box c1 reveal"><h3>💪 Physical strength</h3><div class="hid">Running, swimming, holding on… Is the body enough?</div><div class="tap">TAP</div></div>
  <div class="box c2 reveal"><h3>🧠 Mental strength</h3><div class="hid">Staying calm, making quick decisions, not freezing.</div><div class="tap">TAP</div></div>
  <div class="box c4 reveal"><h3>❤️ Emotional strength</h3><div class="hid">Surviving the memories AFTER the danger is over. Living with guilt and fear.</div><div class="tap">TAP</div></div>
 </div>
 <div class="task"><b>PAIR TALK:</b> Which kind of strength is the most important for survival? Why? Be ready to share one reason.</div>`},

{tag:"Background", title:'Meet the <span>author</span> & the storm', time:120, host:"Point 2! Who wrote this, and what is a typhoon?",
 html:`<div class="grid g2">
  <div>
   <div class="box author"><div class="avatar">✍️</div><div><h3>Haruki Murakami</h3><p style="margin:0">Born 1949, Japan. He decided to become a writer while watching a baseball game in 1978. His stories are translated into many languages.</p></div></div>
   <div class="box c3 reveal" style="margin-top:14px"><h3>🌀 What is a typhoon?</h3><div class="hid">A huge tropical storm that forms in the northwest Pacific Ocean. It brings very strong winds, heavy rain, enormous waves and flooding. Japan is hit by several every year.</div><div class="tap">TAP</div></div>
  </div>
  <div class="box" style="text-align:center">
   <h3>The “eye” of the storm</h3>
   <div class="storm"><div class="ring"></div><div class="ring ring2"></div><div class="eye">EYE<br>calm</div></div>
   <div class="reveal box c2" style="margin-top:12px;min-height:80px"><b>Why does it matter?</b><div class="hid">In the centre of a typhoon there is a short, quiet calm. It looks safe… but the storm comes back. Remember this for the story!</div><div class="tap">TAP</div></div>
  </div>
 </div>`},

{tag:"Concept Vocabulary", title:'Six <span>power</span> words', time:180, host:"Point 3! Vocabulary time. Tap a card to flip it!",
 html:`<p class="lead">These words show the seventh man’s feelings and state of mind. Tap each card to flip it.</p>
 <div class="grid g3">
  <div class="flip k1"><div class="in"><div class="f">desperate</div><div class="b">involving extreme danger or disaster<i>a desperate silence after the wave</i></div></div></div>
  <div class="flip k2"><div class="in"><div class="f">entranced</div><div class="b">in a state of wonder or amazement<i>frozen, unable to look away</i></div></div></div>
  <div class="flip k3"><div class="in"><div class="f">hallucination</div><div class="b">something seen or heard that is not really there<i>he insists what he saw was real</i></div></div></div>
  <div class="flip k4"><div class="in"><div class="f">premonition</div><div class="b">a feeling that something (bad) is about to happen<i>pre = before</i></div></div></div>
  <div class="flip k5"><div class="in"><div class="f">profound</div><div class="b">intense; deep<i>a profound terror</i></div></div></div>
  <div class="flip k6"><div class="in"><div class="f">meditative</div><div class="b">given to deep, extended thought<i>calm and thoughtful</i></div></div></div>
 </div>
 <div class="task"><b>BOOK p.132:</b> Rank the six words from most familiar (1) to least familiar (6) in your notebook.</div>`},

{tag:"First Read", title:'How we <span>read</span> fiction', time:60, host:"Point 4! Our reading game plan!",
 html:`<p class="lead">As we read “The Seventh Man,” we use the four First Read steps. Tap each one.</p>
 <div class="grid g4">
  <div class="box c1 reveal"><h3>👀 NOTICE</h3><div class="hid">WHO the story is about, WHAT happens, WHERE and WHEN, and WHY people react as they do.</div><div class="tap">TAP</div></div>
  <div class="box c2 reveal"><h3>✏️ ANNOTATE</h3><div class="hid">Mark vocabulary and key passages you want to come back to.</div><div class="tap">TAP</div></div>
  <div class="box c3 reveal"><h3>🔗 CONNECT</h3><div class="hid">Link ideas to what you already know and what you have already read.</div><div class="tap">TAP</div></div>
  <div class="box c4 reveal"><h3>💬 RESPOND</h3><div class="hid">Answer the Comprehension Check (p.145) and write a short summary.</div><div class="tap">TAP</div></div>
 </div>
 <div class="task"><b>BOOKS OPEN:</b> Turn to page 133. Let’s begin reading!</div>`},

{tag:"Characters · ¶1–11", title:'Who is in the <span>story</span>?', time:180, host:"Point 5! Meet the players!",
 html:`<p class="lead">On a stormy night, a group of people take turns telling stories. The seventh man tells his. Tap to meet the characters.</p>
 <div class="grid g4">
  <div class="box c1 reveal"><h3>🧔 The seventh man</h3><div class="hid">In his mid-fifties, thin, with a small scar near his eye. Quiet and simple. He tells the story of something that happened when he was <b>10</b>.</div><div class="tap">TAP</div></div>
  <div class="box c2 reveal"><h3>🎨 K.</h3><div class="hid">His best friend, one year younger. Small and frail, with a speech problem, but a brilliant young <b>painter</b>.</div><div class="tap">TAP</div></div>
  <div class="box c3 reveal"><h3>👨‍⚕️ The father</h3><div class="hid">The local doctor. He lets the boy go outside during the calm of the storm.</div><div class="tap">TAP</div></div>
  <div class="box c4 reveal"><h3>🐶 The dog</h3><div class="hid">K.’s little white dog, who follows the boys to the beach.</div><div class="tap">TAP</div></div>
 </div>
 <div class="task"><b>DISCUSS:</b> How does the narrator feel about K.? Find one detail in ¶10 that shows it.</div>`},

{tag:"The Storm · ¶11–28", title:'Into the <span>eye</span> of the storm', time:150, host:"Point 6! The storm is coming… tap each step!",
 html:`<p class="lead">Tap each step to follow what happens.</p>
 <div class="tl">
  <div class="step"><b>1</b><span class="q">Tap…</span><span class="hid">A huge typhoon hits the town. The family prepares and waits inside.</span></div>
  <div class="step"><b>2</b><span class="q">Tap…</span><span class="hid">Suddenly everything goes quiet: they are in the <b>eye</b> of the storm.</span></div>
  <div class="step"><b>3</b><span class="q">Tap…</span><span class="hid">The father says the calm will last 15–20 minutes. The boy promises to come back at the first sign of wind.</span></div>
  <div class="step"><b>4</b><span class="q">Tap…</span><span class="hid">He goes to the beach with K. and the dog. Strange things lie on the sand.</span></div>
  <div class="step"><b>5</b><span class="q">Tap…</span><span class="hid">The sea comes in strangely close. K. is lost in looking at something and does not hear his friend shout.</span></div>
 </div>
 <h3 style="margin:6px 0 8px">🔮 PREDICT: What will happen next? Count the class votes!</h3>
 <div class="vote" data-vote="p6">
  <div class="vrow"><div class="lab"><div class="fill"></div><span>A. K. hears him and they both run home</span></div><button class="plus">+</button><button class="minus">−</button><div class="n">0</div></div>
  <div class="vrow"><div class="lab"><div class="fill"></div><span>B. A giant wave comes and something terrible happens</span></div><button class="plus">+</button><button class="minus">−</button><div class="n">0</div></div>

 if(s&&Math.random()<.2)f.classList.add('hasSign');el.appendChild(f);}}

/* =================== AUDIO (all synthesized here, original) =================== */
let ac,master,mG,sG,seaG,musicOn=true,sfxOn=true,seaOn=false,mT,nn=0,st=0,nb,seaSrc;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
 mG=ac.createGain();mG.gain.value=.12;mG.connect(master);sG=ac.createGain();sG.gain.value=.7;sG.connect(master);seaG=ac.createGain();seaG.gain.value=0;seaG.connect(master);}catch(e){ac=null}}
function resume(){if(ac&&ac.state==='suspended')ac.resume()}
const N=f=>440*Math.pow(2,(f-69)/12);
function tone(f,t,d,type,g,dest){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(dest);o.start(t);o.stop(t+d+.05);}
function noise(){if(nb)return nb;const l=ac.sampleRate*2;nb=ac.createBuffer(1,l,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<l;i++)d[i]=Math.random()*2-1;return nb;}
function nHit(t,d,g,fr,dest){const s=ac.createBufferSource();s.buffer=noise();const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=fr;const v=ac.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(v);v.connect(dest);s.start(t);s.stop(t+d+.05);}
// laid-back classroom groove: Am–F–C–G, 96 bpm
const CH=[[45,48,52],[41,45,48],[48,52,55],[43,47,50]];
const MEL=[76,0,72,0,74,72,69,0, 72,0,69,0,72,74,76,0, 79,0,76,0,74,72,74,0, 74,0,71,0,67,69,71,0];
function sched(){const spb=60/96/2;while(nn<ac.currentTime+.2){const ch=CH[Math.floor(st/8)%4],t=nn;
 if(st%8===0||st%8===5)tone(N(ch[0]-12),t,.4,'triangle',.9,mG);
 if(st%4===2)ch.forEach(n=>tone(N(n+12),t,.25,'triangle',.12,mG));
 const m=MEL[st%32];if(m)tone(N(m),t,.3,'sine',.22,mG);
 if(st%2===1)nHit(t,.04,.12,7000,mG); if(st%8===4)nHit(t,.12,.35,1800,mG);
 if(st%8===0){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);v.gain.setValueAtTime(.7,t);v.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(v);v.connect(mG);o.start(t);o.stop(t+.25);}
 nn+=spb;st++;}}
function startMusic(){if(!ac||!musicOn)return;resume();nn=ac.currentTime+.05;clearInterval(mT);mT=setInterval(sched,50);}
function stopMusic(){clearInterval(mT)}
function startSea(){if(!ac)return;resume();if(seaSrc)return;seaSrc=ac.createBufferSource();seaSrc.buffer=noise();seaSrc.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
 const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.12;lg.gain.value=.22;const base=ac.createGain();base.gain.value=.28;lfo.connect(lg);lg.connect(base.gain);
 seaSrc.connect(f);f.connect(base);base.connect(seaG);seaSrc.start();lfo.start();seaG.gain.setTargetAtTime(.9,ac.currentTime,.5);}
function stopSea(){if(seaSrc){seaG.gain.setTargetAtTime(0,ac.currentTime,.3);const s=seaSrc;seaSrc=null;setTimeout(()=>{try{s.stop()}catch(e){}},1500);}}
function cheer(big){if(!ac||!sfxOn)return;const t=ac.currentTime,d=big?3.4:2;const s=ac.createBufferSource();s.buffer=noise();s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=.6;
 const v=ac.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(big?.9:.6,t+.25);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(v);v.connect(sG);s.start(t);s.stop(t+d+.1);
 for(let i=0;i<(big?14:8);i++){const a=t+Math.random()*.8,o=ac.createOscillator(),g=ac.createGain();o.type='sine';const b=500+Math.random()*500;o.frequency.setValueAtTime(b,a);o.frequency.linearRampToValueAtTime(b*1.6,a+.35);g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(.05,a+.05);g.gain.exponentialRampToValueAtTime(.001,a+.5);o.connect(g);g.connect(sG);o.start(a);o.stop(a+.55);}
 for(let i=0;i<(big?26:12);i++)nHit(t+.2+Math.random()*(d-.6),.06,.35,1500,sG);
 [0,4,7,12].forEach((n,i)=>tone(N(72+n),t+i*.08,.35,'triangle',.25,sG));}
function ooh(){if(!ac||!sfxOn)return;const t=ac.currentTime;for(let i=0;i<6;i++){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=700;
 const b=180+Math.random()*120;o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*1.25,t+.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.connect(f);f.connect(g);g.connect(sG);o.start(t);o.stop(t+1.4);}}
function buzzer(){if(!ac||!sfxOn)return;const t=ac.currentTime;tone(330,t,.5,'square',.15,sG);tone(262,t+.45,.7,'square',.15,sG);}
function click(){if(ac&&sfxOn)tone(880,ac.currentTime,.05,'square',.06,sG)}
function pling(){if(ac&&sfxOn){const t=ac.currentTime;tone(N(79),t,.25,'triangle',.25,sG);tone(N(84),t+.07,.3,'triangle',.2,sG);}}
function ding(){if(ac&&sfxOn){const t=ac.currentTime;[0,4,7].forEach((n,i)=>tone(N(76+n),t+i*.06,.3,'sine',.25,sG));}}
function whoosh(){if(ac&&sfxOn)nHit(ac.currentTime,.25,.25,900,sG)}
function tick(up){if(ac&&sfxOn)tone(up?1046:523,ac.currentTime,.07,'square',.07,sG)}

const mBtn=document.getElementById('mBtn'),sfxBtn=document.getElementById('sfxBtn'),seaBtn=document.getElementById('seaBtn'),fanBtn=document.getElementById('fanBtn');
mBtn.onclick=()=>{initAudio();musicOn=!musicOn;mBtn.classList.toggle('off',!musicOn);musicOn?startMusic():stopMusic();};
sfxBtn.onclick=()=>{initAudio();sfxOn=!sfxOn;sfxBtn.classList.toggle('off',!sfxOn);};
seaBtn.onclick=()=>{initAudio();seaOn=!seaOn;seaBtn.classList.toggle('off',!seaOn);seaOn?startSea():stopSea();};
fanBtn.onclick=()=>{crowd.classList.toggle('hide');fanBtn.classList.toggle('off',crowd.classList.contains('hide'));};
document.getElementById('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'&&cur>=0&&cur<P.length){initAudio();click();cur<P.length-1?go(cur+1):finale();}
 if(e.key==='ArrowLeft'&&cur>0&&cur<P.length){click();go(cur-1);}});

/* =================== CONFETTI =================== */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[];
function sz(){cv.width=innerWidth;cv.height=innerHeight}
function burst(n,top){const c=['#ffd23f','#ff4d6d','#2ec4b6','#7b5cff','#3ddc84','#fff'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6,y:top?60:innerHeight*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(c),star:Math.random()<.35,life:160});}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
 parts.forEach(p=>{p.vy+=.22;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
 if(p.star){cx.beginPath();for(let k=0;k<5;k++){cx.lineTo(Math.cos((18+k*72)*Math.PI/180)*p.s,-Math.sin((18+k*72)*Math.PI/180)*p.s);cx.lineTo(Math.cos((54+k*72)*Math.PI/180)*p.s/2.3,-Math.sin((54+k*72)*Math.PI/180)*p.s/2.3);}cx.closePath();cx.fill();}
 else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});requestAnimationFrame(loop);}

addEventListener('resize',()=>{sz();buildCrowd()});
sz();buildCrowd();loop();start();
</script>
